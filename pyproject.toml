[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simface"
version = "0.1.0"
description = "OOTP-style face generator and portrait automater for baseball, basketball and football sims"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
photo = ["numpy>=1.24", "opencv-python-headless>=4.8"]
dev = ["pytest>=7"]

[project.scripts]
simface = "simface.cli:main"

[tool.setuptools.packages.find]
include = ["simface*"]

[tool.setuptools.package-data]
simface = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
